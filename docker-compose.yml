services:
  mongo:
    image: mongo:7
    container_name: fitnfood-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: fitnfood-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      MONGO_DB: mongodb+srv://ronm250304:Inzuki123456@cluster0.xn5xe.mongodb.net/FitnFood?retryWrites=true&w=majority&appName=Cluster0
      CLIENT_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
    depends_on:
      - mongo
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL_BACKEND: http://localhost:3001/api
    container_name: fitnfood-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
